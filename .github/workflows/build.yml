name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleRelease -PvCode=${{ github.run_number }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hamsa-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
      - name: نشر الـ APK في مجلد السيرفر (رابط /download)
        run: |
          mkdir -p server
          cp app/build/outputs/apk/release/app-release.apk server/app.apk
          echo '{"apk":${{ github.run_number }}}' > server/apk.json
          git config user.name "hamsa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add server/app.apk server/apk.json
          git commit -m "apk ${{ github.run_number }} [skip ci]"
          git pull --rebase origin main || true
          git push
